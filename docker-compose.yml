# Local development stack: the API and Postgres.
#
#   docker compose up --build
#   open http://localhost:8000/docs
#
# Values come from .env (copy .env.example). The ${VAR:-default} fallbacks exist only so a clean
# clone starts without any setup; they are well-known development values, not secrets. Set real
# ones in .env before exposing the API anywhere.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vergeo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vergeo-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-vergeo_reports}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published to the host: only the api container reaches it, over the compose network,
    # at hostname "db". Uncomment to inspect with psql from the host.
    # ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      # "db" is the service name above; Docker's internal DNS resolves it. "localhost" inside
      # the api container would mean the api container itself.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vergeo}:${POSTGRES_PASSWORD:-vergeo-dev-only}@db:5432/${POSTGRES_DB:-vergeo_reports}
      INGEST_API_KEY: ${INGEST_API_KEY:-dev-ingest-key}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-4194304}
    ports:
      - "8000:8000"
    depends_on:
      db:
        # Wait until Postgres accepts connections, not merely until its container has started,
        # or the api's `alembic upgrade head` races the database boot.
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
