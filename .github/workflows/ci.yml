# Runs on every push and pull request: lint, migrate a fresh Postgres, run the test suite.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # A throwaway Postgres for this job, reachable from the runner at localhost:5432.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vergeo
          POSTGRES_PASSWORD: vergeo
          POSTGRES_DB: vergeo_test
        ports:
          - 5432:5432
        # Don't start the steps until Postgres accepts connections.
        options: >-
          --health-cmd "pg_isready -U vergeo -d vergeo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Used by the migration steps (via app.config) and by the tests (tests/conftest.py).
      DATABASE_URL: postgresql+psycopg://vergeo:vergeo@localhost:5432/vergeo_test
      TEST_DATABASE_URL: postgresql+psycopg://vergeo:vergeo@localhost:5432/vergeo_test
      INGEST_API_KEY: ci-ingest-key
      ADMIN_API_KEY: ci-admin-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      # Migrations are checked on their own, before the tests, so a broken migration fails with
      # a clear message: upgrade a fresh DB, downgrade to empty, upgrade again, then confirm
      # models.py and the migrations describe the same schema.
      - name: Migrations
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check

      - name: Tests
        run: pytest -q
